buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { name = "GTNH Maven"; url = "https://repo.gtnewhorizons.net/releases/" }
        gradlePluginPortal()
    }
    dependencies { classpath("com.gtnewhorizons:retrofuturagradle:2.0.2") }
}

apply plugin: "com.gtnewhorizons.retrofuturagradle"

version = "1.2.2"
group = "com.gtnewhorizons"

java {
    toolchain { languageVersion.set(JavaLanguageVersion.of(25)) }
}

minecraft {
    skipSlowTasks.set(true)
    usesFml.set(true)
    usesForge.set(true)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { name = "GTNH Maven"; url = "https://repo.gtnewhorizons.net/releases/" }
}

dependencies {
    // No external dependencies - the mod only uses Minecraft/Forge APIs which RFG provides
}
